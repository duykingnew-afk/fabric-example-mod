# Runs the REAL Minecraft 1.21.1 + Fabric Loader, installed the way a launcher does it, with the freshly built
# Pocket FSR jar in the mods folder: first with Sodium, then with Sodium + Iris and a tiny test shader pack
# (ci/shaderpack). It takes the same screenshots as smoketest.yml, to check that Pocket FSR works together with
# Sodium and with shader packs. (Iris cannot be loaded in the Gradle dev environment, so this is not "runClient".)
# Screenshots and logs go to a rolling pre-release called "ci-iris".

name: smoketest-iris
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: smoketest-iris
  cancel-in-progress: false

jobs:
  smoke-iris:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk (25 builds the mod, 21 runs the game like a phone launcher does)
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            25
          distribution: 'microsoft'
      - name: install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libglx-mesa0 mesa-utils libxrandr2 libxinerama1 libxcursor1 libxi6 libxxf86vm1 libopenal1
      - name: build the mod jar
        run: |
          chmod +x ./gradlew
          ./gradlew build
          ls -la build/libs
      - name: install Minecraft 1.21.1 and Fabric Loader
        run: |
          python3 -m venv .venv
          .venv/bin/pip install minecraft-launcher-lib pillow
          .venv/bin/pip show minecraft-launcher-lib | head -3
          .venv/bin/python ci/run_prod.py install
          echo "java for the game: $JAVA_HOME_21_X64"
          "$JAVA_HOME_21_X64/bin/java" -version
      - name: run with Sodium
        id: sodium
        continue-on-error: true
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -e '-sources' -e '-dev' | head -n 1)
          .venv/bin/python ci/run_prod.py run --game-dir prod/sodium --mod-jar "$JAR" \
            --java "$JAVA_HOME_21_X64/bin/java" --mods fabric-api sodium --prefix sodium-
      - name: run with Sodium, Iris and the test shader pack
        id: iris
        continue-on-error: true
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -e '-sources' -e '-dev' | head -n 1)
          .venv/bin/python ci/run_prod.py run --game-dir prod/iris --mod-jar "$JAR" \
            --java "$JAVA_HOME_21_X64/bin/java" --mods fabric-api sodium iris \
            --shaderpack ci/shaderpack --prefix iris-
      - name: compare the screenshots (switching on and off must not change the picture)
        id: compare
        if: always()
        continue-on-error: true
        run: |
          mkdir -p out
          status=0
          : > out/compare.txt
          for scenario in sodium iris; do
            echo "== $scenario" >> out/compare.txt
            .venv/bin/python ci/compare_shots.py "prod/$scenario/smoketest" "$scenario-" >> out/compare.txt || status=1
            echo >> out/compare.txt
          done
          cat out/compare.txt
          exit $status
      - name: show the interesting log lines
        if: always()
        run: |
          for dir in prod/sodium prod/iris; do
            echo "=================== $dir"
            cat "$dir/mods-used.txt" 2>/dev/null || true
            LOG="$dir/logs/latest.log"
            [ -e "$LOG" ] || LOG="$dir/launcher-output.log"
            grep -n "PocketFSR\|Iris\|Sodium\|mixin\|Mixin\|Exception\|ERROR\|FATAL\|Loading Minecraft" "$LOG" | cut -c1-300 | head -150 || true
            ls -la "$dir/smoketest" "$dir/crash-reports" 2>/dev/null || true
          done
      - name: publish screenshots and logs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          for dir in prod/sodium prod/iris; do
            prefix=$(basename "$dir")-
            cp "$dir"/smoketest/*.png out/ 2>/dev/null || true
            cp "$dir/logs/latest.log" "out/${prefix}game-latest.log" 2>/dev/null || true
            cp "$dir/launcher-output.log" "out/${prefix}launcher-output.log" 2>/dev/null || true
            cp "$dir/mods-used.txt" "out/${prefix}mods-used.txt" 2>/dev/null || true
            for crash in "$dir"/crash-reports/*.txt; do
              [ -e "$crash" ] || continue
              cp "$crash" "out/${prefix}$(basename "$crash")"
            done
          done
          ls -la out
          NOTES="Screenshots and logs of the automatic render test on the real game (Fabric Loader, production jars) with Sodium, and with Sodium + Iris + a small test shader pack, commit ${GITHUB_SHA}. Not a mod release. Mods used: $(tr '\n' ';' < prod/iris/mods-used.txt 2>/dev/null)"
          for attempt in 1 2 3; do
            gh release delete ci-iris --cleanup-tag -y || true
            if gh release create ci-iris out/* \
                --prerelease --target "${GITHUB_SHA}" \
                --title "Iris test (${GITHUB_SHA::7})" \
                --notes "$NOTES"; then
              break
            fi
            echo "creating the release failed (attempt ${attempt}), trying again"
            sleep 15
          done
          gh release view ci-iris > /dev/null
      - name: fail the job if a scenario failed
        if: always()
        run: |
          echo "with Sodium: ${{ steps.sodium.outcome }}"
          echo "with Sodium + Iris + shader pack: ${{ steps.iris.outcome }}"
          echo "screenshots comparison: ${{ steps.compare.outcome }}"
          [ "${{ steps.sodium.outcome }}" = "success" ] && [ "${{ steps.iris.outcome }}" = "success" ] && [ "${{ steps.compare.outcome }}" = "success" ]
