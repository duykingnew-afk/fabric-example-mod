# Starts the real Minecraft 1.21.1 client with the mod on a virtual display (software OpenGL),
# creates a world, renders it natively and through every upscaling mode, and saves screenshots.
# This catches mixin errors, shader compile errors and GL errors that a plain compile cannot.
# The screenshots, the game log and a freshly built mod jar are attached to a rolling pre-release
# called "ci-smoke": a development build of the latest commit, not a versioned release.

name: smoketest
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# one run at a time, so two runs never delete and re-create the rolling release at the same moment
concurrency:
  group: smoketest
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libglx-mesa0 mesa-utils libxrandr2 libxinerama1 libxcursor1 libxi6 libxxf86vm1 libopenal1
          xvfb-run -a -s "-screen 0 1280x720x24" glxinfo -B || true
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: prepare run directory
        run: |
          mkdir -p run
          printf 'onboardAccessibility:false\ngraphicsMode:1\nrenderDistance:8\nguiScale:0\npauseOnLostFocus:false\ntutorialStep:none\nmaxFps:260\nenableVsync:false\nlang:en_us\n' > run/options.txt
          printf 'eula=true\n' > run/eula.txt
      - name: run the client
        env:
          POCKETFSR_SMOKETEST: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          MESA_GLSL_VERSION_OVERRIDE: '450'
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --args="--width 1280 --height 720" 2>&1 | tee run/gradle-run.log
      - name: show the mod's log lines
        if: always()
        run: |
          grep -n "PocketFSR\|mixin\|Exception" run/logs/latest.log | cut -c1-400 | head -200 || true
          ls -la run/smoketest || true
      - name: build the mod jar
        if: always()
        continue-on-error: true
        run: ./gradlew build
      - name: publish jar, screenshots and log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p run/smoketest
          cp run/logs/latest.log run/smoketest/game-latest.log 2>/dev/null || true
          cp run/gradle-run.log run/smoketest/gradle-run.log 2>/dev/null || true
          for jar in build/libs/*.jar; do
            [ -e "$jar" ] || continue
            case "$jar" in
              *-sources.jar|*-dev.jar) ;;
              *) cp "$jar" run/smoketest/ ;;
            esac
          done
          ls -la run/smoketest
          NOTES="Development build of commit ${GITHUB_SHA}: the mod jar (pocketfsr-*.jar) plus the screenshots and logs of the automatic render test. Not a versioned release; it is replaced on every push to main. Needs Fabric Loader for Minecraft 1.21.1 and Fabric API. Untested on real phones or tablets."
          for attempt in 1 2 3; do
            gh release delete ci-smoke --cleanup-tag -y || true
            if gh release create ci-smoke run/smoketest/* \
                --prerelease --target "${GITHUB_SHA}" \
                --title "Development build (${GITHUB_SHA::7})" \
                --notes "$NOTES"; then
              break
            fi
            echo "creating the release failed (attempt ${attempt}), trying again"
            sleep 15
          done
          gh release view ci-smoke > /dev/null
