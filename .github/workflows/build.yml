# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: show the packaged mod (files, mixin config, remapped names)
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | grep -v -- '-dev' | head -n 1)
          echo "== $JAR"
          unzip -l "$JAR"
          for f in $(unzip -Z1 "$JAR" | grep -E 'refmap\.json$|mixins\.json$'); do
            echo "== $f"
            unzip -p "$JAR" "$f"
            echo
          done
          # Loom 1.19 remaps the mixins inside the classes (no refmap file), so the intermediary names must be there
          for c in $(unzip -Z1 "$JAR" | grep -E 'pocketfsr/mixin/.*\.class$'); do
            echo "== $c"
            unzip -p "$JAR" "$c" | strings | grep -E 'class_[0-9]+|method_[0-9]+|field_[0-9]+' | sort -u
          done
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
