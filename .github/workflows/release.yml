# Builds the mod and attaches the jar to a GitHub Release whenever a version tag is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Releases are marked "pre-release" until the mod has been tested on real devices.

name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | grep -v -- '-dev' | head -n 1)
          echo "Publishing $JAR"
          gh release create "${GITHUB_REF_NAME}" "$JAR" \
            --title "Pocket FSR ${GITHUB_REF_NAME}" \
            --prerelease \
            --notes "Pocket FSR for Minecraft 1.21.1 (Fabric). Put the .jar in your mods folder together with Fabric API. See the README for usage and known limits."
